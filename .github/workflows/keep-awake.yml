name: Keep API awake

# Free Render services sleep after 15 minutes without traffic, which would
# stop the once-a-minute reminder job. A light health check every 10 minutes
# keeps it running. The repository variable API_URL overrides the default
# address, for example when running a fork.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  API_URL: ${{ vars.API_URL || 'https://gradpilot-api-ui1q.onrender.com' }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the health endpoint
        run: curl --silent --show-error --fail --max-time 90 --retry 2 "$API_URL/api/health"
