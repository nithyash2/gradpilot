spring:
  application:
    name: gradpilot-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gradpilot}
    username: ${DB_USERNAME:gradpilot}
    password: ${DB_PASSWORD:gradpilot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
