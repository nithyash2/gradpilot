[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Single-page app: let the app handle every path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be cached, so updates reach phones quickly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
