# Render Blueprint for the GradPilot API.
# New > Blueprint in the Render dashboard, then pick this repository.
services:
  - type: web
    name: gradpilot-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      # Supabase connection (Session pooler), e.g.
      # jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Long random signing key, generated by Render
      - key: JWT_SECRET
        generateValue: true
      # From: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # The Netlify address of the web app, e.g. https://gradpilot.netlify.app
      - key: CORS_ORIGINS
        sync: false
